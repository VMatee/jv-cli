name: Windows trusted-host package acceptance
on:
  workflow_call:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  windows-package:
    name: Windows package build and installed acceptance
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      JV_API_BASE_URL: 'http://127.0.0.1:9'
      JV_API_USERNAME: ''
      JV_API_PASSWORD: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.10'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.12.0'}
      - run: python -B scripts/build_windows.py
      - name: Installed bridge, pinned engine, isolation and installer lifecycle
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $fixtureNode = (Get-Command node.exe).Source
          python -B scripts/windows_package_acceptance.py --installer "dist/jv-cli-$version-windows-x86_64-setup.exe" --portable "dist/jv-cli-$version-windows-x86_64.zip" --node "$fixtureNode"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native trusted-host source gate
        shell: pwsh
        run: |
          python -B -c "import sys,pathlib,tarfile; sys.path.insert(0,'lib'); from jvcli.platform.windows import private_dir; p=private_dir(pathlib.Path('downloads/accepted-engine').resolve()); tarfile.open('downloads/codex-0.149.1-win32-x64.tgz').extractall(p)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/windows_bridge_acceptance.py --engine downloads/accepted-engine/package/vendor/x86_64-pc-windows-msvc/bin/codex.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/manage.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact Windows release inventory
        shell: pwsh
        run: |
          python -B scripts/release_assets.py collect --source dist --output artifacts/windows --platform windows --version ((Get-Content VERSION -Raw).Trim()) --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: windows, path: 'artifacts/windows/*', if-no-files-found: error}
