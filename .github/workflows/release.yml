name: JV CLI release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag and canonical version
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Run complete tests
        run: ./test.sh
      - name: Verify package source
        run: ./verify.sh
      - name: Install application in portable mode
        run: ./install.sh --portable
      - name: Run execution acceptance
        run: python3 -B scripts/engine_smoke.py
      - name: Run session and completion checks
        run: |
          python3 -B scripts/agent_smoke.py --engine "$PWD/runtime/node_modules/.bin/codex"
          python3 -B scripts/completion_smoke.py --engine "$PWD/runtime/node_modules/.bin/codex"
      - name: Build release
        run: ./scripts/build-release.sh
      - name: Build offline release
        run: ./scripts/build-offline-release.sh
      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c "jv-cli-$(cat ../VERSION)-linux-x86_64.zip.sha256"
          sha256sum -c "jv-cli-$(cat ../VERSION)-linux-x86_64-offline.zip.sha256"
      - name: Verify extracted release
        run: |
          directory=$(mktemp -d)
          unzip -q "dist/jv-cli-$(cat VERSION)-linux-x86_64.zip" -d "$directory"
          "$directory/jv-cli/verify.sh"
      - name: Verify offline installation with a temporary home
        run: |
          directory=$(mktemp -d)
          mkdir -p "$directory/home" "$directory/no-downloads"
          unzip -q "dist/jv-cli-$(cat VERSION)-linux-x86_64-offline.zip" -d "$directory"
          "$directory/jv-cli/verify.sh"
          for command in node npm curl; do
            printf '#!/bin/sh\nexit 97\n' > "$directory/no-downloads/$command"
            chmod +x "$directory/no-downloads/$command"
          done
          HOME="$directory/home" PATH="$directory/no-downloads:$PATH" \
            "$directory/jv-cli/install-offline.sh"
          HOME="$directory/home" PATH="$directory/no-downloads:$PATH" \
            "$directory/home/.local/bin/jvcli" doctor
          HOME="$directory/home" PATH="$directory/no-downloads:$PATH" \
            python3 -B "$directory/home/.local/share/jv-cli/scripts/engine_smoke.py"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          assets=(
            "dist/jv-cli-$version-linux-x86_64.zip"
            "dist/jv-cli-$version-linux-x86_64.zip.sha256"
            "dist/jv-cli-$version-linux-x86_64-offline.zip"
            "dist/jv-cli-$version-linux-x86_64-offline.zip.sha256"
          )
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --latest \
            --title "JV CLI $version" --notes-file "docs/releases/$version.md"
      - name: Refresh earlier customer release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in 0.4.3 0.4.4; do
            gh release edit "v$version" --title "JV CLI $version" \
              --notes-file "docs/releases/$version.md"
          done
