name: JV CLI release
on:
  push:
    branches: [main, feature/windows-native]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -B scripts/manage.py verify
      - run: python -B -m unittest discover -s tests -p "test_release*.py" -v
      - name: Canonical tag and exact green main gate
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python -B scripts/release_gate.py
  linux:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: ./test.sh
      - run: ./verify.sh
      - run: ./install.sh --portable
      - name: Pinned engine synthetic execution and sessions
        run: |
          python -B scripts/engine_smoke.py
          python -B scripts/agent_smoke.py --engine "$PWD/runtime/node_modules/.bin/codex"
          python -B scripts/completion_smoke.py --engine "$PWD/runtime/node_modules/.bin/codex"
      - run: ./scripts/build-release.sh
      - run: ./scripts/build-offline-release.sh
      - run: bash scripts/release_linux_acceptance.sh
      - run: python -B scripts/release_assets.py collect --source dist --output artifacts/linux --platform linux --version "$(cat VERSION)" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: linux, path: 'artifacts/linux/*', if-no-files-found: error}
  windows:
    needs: verify
    uses: ./.github/workflows/windows-package.yml
  assemble:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: '{linux,windows}', path: artifacts}
      - run: python -B scripts/release_assets.py assemble --source artifacts --output release --version "$(cat VERSION)" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: release, path: 'release/*', if-no-files-found: error}
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, linux, windows, assemble]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: release, path: release}
      - name: Publish once after verification
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 -B scripts/release_gate.py
          python3 -B scripts/release_assets.py verify --output release --version "$(cat VERSION)" --commit "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --latest --title "JV CLI $(cat VERSION)" --notes-file "docs/releases/$(cat VERSION).md"
      - name: Redownload public bytes twice
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          for round in 1 2; do
            gh release download "$GITHUB_REF_NAME" --dir "public-$round"
            python3 -B scripts/release_assets.py verify --output "public-$round" --version "$(cat VERSION)" --commit "$GITHUB_SHA"
            cmp release/SHA256SUMS "public-$round/SHA256SUMS"
            cmp release/BUILD-INFO.json "public-$round/BUILD-INFO.json"
          done
